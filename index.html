<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 花神语文大对战 🌸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(circle at 50% 0%, #ffe9c7 0%, #ffd2a6 45%, #f7a880 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #5a3520;
  }
  .panel {
    width: 100%; max-width: 880px;
    background: rgba(255, 248, 238, 0.82);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 28px; padding: 30px 26px 26px;
    box-shadow: 0 20px 60px rgba(180, 90, 40, 0.28); backdrop-filter: blur(6px);
  }
  h1 {
    text-align: center; font-size: clamp(24px, 5vw, 38px); color: #e8642e;
    text-shadow: 0 2px 10px rgba(255,140,60,0.3); margin-bottom: 6px; letter-spacing: 2px;
  }
  .subtitle { text-align: center; color: #a9714c; font-size: 14px; margin-bottom: 18px; }

  /* ---- 名字输入 ---- */
  .name-row { display:flex; justify-content:center; margin-bottom: 20px; }
  .name-row input {
    width: min(380px, 100%); padding: 14px 18px; font-size: 17px;
    border: 2px solid #ffc28a; border-radius: 14px; background:#fffdf9; color:#6b4226;
    outline: none; text-align:center; transition:border-color .15s, box-shadow .15s;
  }
  .name-row input:focus { border-color:#ff7a3c; box-shadow:0 0 0 3px rgba(255,122,60,0.2); }

  /* ---- 历史/段位卡（选花页）---- */
  .history-card { display:flex; align-items:center; gap:14px; background: rgba(255,255,255,0.62);
    border:1px solid rgba(255,180,130,0.5); border-radius:16px; padding:12px 16px; margin-bottom:18px; }
  .hc-left { text-align:center; flex:0 0 auto; }
  .hc-badge { font-size:34px; line-height:1; }
  .hc-rank { font-size:13px; font-weight:800; color:#c2410c; margin-top:2px; }
  .hc-mid { flex:1; }
  .hc-line { font-weight:800; color:#6b4226; font-size:15px; }
  .hc-stats { font-size:13px; color:#a9714c; margin:2px 0 6px; }
  .hc-progress { height:9px; background: rgba(255,170,110,0.28); border-radius:6px; overflow:hidden; }
  .hc-progress-fill { height:100%; width:0%; border-radius:6px; background: linear-gradient(90deg,#ff9a3c,#ff6b35); transition:width .5s; }
  .hc-next { font-size:12px; color:#8a5a36; margin-top:5px; }

  /* ---- 段位面板（结算页）---- */
  .rank-panel { background: rgba(255,255,255,0.6); border:1px solid rgba(255,180,130,0.5);
    border-radius:16px; padding:16px; margin:0 auto 18px; max-width:520px; }
  .rp-top { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px; }
  .rp-badge { font-size:30px; }
  .rp-name { font-size:20px; font-weight:900; color:#c2410c; }
  .rp-progress { height:11px; background: rgba(255,170,110,0.28); border-radius:7px; overflow:hidden; }
  .rp-progress-fill { height:100%; width:0%; border-radius:7px; background: linear-gradient(90deg,#36c46b,#7be08f); transition:width .6s; }
  .rp-next { font-size:13px; color:#8a5a36; margin-top:7px; }
  .rp-record { font-size:13px; color:#a9714c; margin-top:4px; }
  .rp-up { color:#2f9e44; font-weight:800; }

  /* ---- 选花网格 ---- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card {
    background: #fffdf9; border-radius: 18px; padding: 16px 8px 12px; text-align: center;
    cursor: pointer; border: 4px solid transparent; box-shadow: 0 4px 12px rgba(200,120,60,0.12);
    transition: transform .15s, border-color .15s, box-shadow .15s; user-select: none;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(200,110,50,0.3); }
  .card svg { width: 76px; height: 76px; display: block; margin: 0 auto 8px; }
  /* 真实照片：圆形缩略图 */
  .card .flower-img { width: 84px; height: 84px; object-fit: cover; border-radius: 50%;
    display: block; margin: 0 auto 8px; box-shadow: 0 3px 8px rgba(160,80,40,0.28);
    border: 3px solid #fff; background:#fff; }
  .card:hover .flower-img { box-shadow: 0 6px 16px rgba(160,80,40,0.4); }
  .fighter .top .flower-img { width:40px; height:40px; object-fit:cover; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(160,80,40,0.3); }
  .qflower .flower-img { width:96px; height:96px; object-fit:cover; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 10px rgba(160,80,40,0.3); }
  .big-flower .flower-img { width:128px; height:128px; object-fit:cover; border-radius:50%; border:4px solid #fff; box-shadow:0 5px 16px rgba(160,80,40,0.35); }
  .card .name { color: #6b4226; font-size: 17px; font-weight: 700; }
  .card .lvl { color:#c2410c; font-size:12px; margin-top:2px; }
  .card.selected {
    border-color: #ff7a3c; box-shadow: 0 0 0 4px rgba(255,122,60,0.22), 0 10px 26px rgba(200,90,40,0.35);
    transform: translateY(-4px);
  }
  .start-btn {
    width: 100%; margin-top: 22px; padding: 18px; font-size: 20px; font-weight: 800;
    letter-spacing: 4px; color: #fff; border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(90deg, #ff8a3c, #ff6b35, #f0532b);
    box-shadow: 0 8px 20px rgba(230,90,40,0.4); transition: filter .15s, transform .1s;
  }
  .start-btn:hover { filter: brightness(1.1); }
  .start-btn:active { transform: scale(0.99); }
  .start-btn:disabled { filter: grayscale(0.55) brightness(0.85); cursor: not-allowed; }

  /* ---- 对战 HUD：你 VS 花神 ---- */
  .battle-bar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .fighter { flex:1; background: rgba(255,255,255,0.6); border-radius:16px; padding:10px 12px; text-align:center; border:2px solid transparent; transition:border-color .25s, box-shadow .25s; }
  .fighter.leading { border-color:#ff8a3c; box-shadow:0 0 0 3px rgba(255,138,60,0.18); }
  .fighter .top { display:flex; align-items:center; gap:8px; margin-bottom:4px; justify-content:center; }
  .fighter .top svg { width:38px; height:38px; }
  .fighter .avatar-emoji { font-size:30px; width:38px; text-align:center; }
  .fighter .fname { font-weight:800; font-size:15px; color:#6b4226; }
  .fighter .frole { font-size:11px; color:#a9714c; }
  .bigscore { font-size:36px; font-weight:900; line-height:1; color:#2f9e44; }
  .bigscore.foe { color:#e8642e; }
  .scoretip { font-size:11px; color:#a9714c; }
  .vs { font-size:22px; font-weight:900; color:#e8642e; flex:0 0 auto; }

  .progress-wrap { background: rgba(255,170,110,0.25); border-radius: 10px; height: 9px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#ff9a3c,#ff6b35); transition: width .3s; }

  .timer-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .timer-label { font-size:13px; color:#a9714c; flex:0 0 auto; font-weight:700; }
  .timer-wrap { flex:1; height:12px; background: rgba(255,170,110,0.25); border-radius:8px; overflow:hidden; }
  .timer-fill { height:100%; width:100%; border-radius:8px; background: linear-gradient(90deg,#36c46b,#7be08f); transition: width 1s linear, background .3s; }
  .timer-fill.warn { background: linear-gradient(90deg,#ffb347,#ffd34d); }
  .timer-fill.danger { background: linear-gradient(90deg,#ff5c5c,#ff8a3c); }
  .timer-num { flex:0 0 auto; width:34px; text-align:right; font-weight:800; font-size:18px; color:#c2410c; }
  .timer-num.danger { color:#e8542e; animation: blink .6s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  .qcard { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,180,130,0.4); border-radius: 20px; padding: 24px 22px; }
  .qtag { display:inline-block; background: rgba(255,122,60,0.16); color:#e8642e; font-size:13px; padding:4px 12px; border-radius:20px; margin-bottom:14px; }
  .qflower { text-align:center; margin: 2px 0 12px; }
  .qflower svg { width: 80px; height: 80px; }
  .qtext { font-size: clamp(19px, 3vw, 25px); font-weight: 700; line-height: 1.55; margin-bottom: 20px; text-align: center; color:#5a3520; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 560px){ .options { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(2, 1fr); } }
  .opt {
    background: #fffdf9; color:#6b4226; border: 3px solid transparent; border-radius: 14px;
    padding: 15px; font-size: 18px; font-weight: 600; cursor: pointer;
    box-shadow:0 3px 8px rgba(200,120,60,0.12); transition: transform .1s, border-color .15s, background .15s; text-align: center;
  }
  .opt:hover { transform: translateY(-2px); border-color: #ff9a3c; }
  .opt.correct { background:#d8f5e1; border-color:#34c759; color:#1a7a35; }
  .opt.wrong { background:#ffe0e0; border-color:#ff5c5c; color:#b32020; }
  .opt.disabled { pointer-events:none; opacity:.92; }
  .feedback { margin-top:18px; background: rgba(255,240,225,0.9); border-radius:14px; padding:16px; font-size:16px; line-height:1.6; color:#6b4226; display:none; }
  .feedback.show { display:block; animation: fade .3s; }
  .feedback .fb-title { font-weight:800; font-size:18px; margin-bottom:6px; }
  .feedback.ok .fb-title { color:#2f9e44; }
  .feedback.no .fb-title { color:#e8542e; }
  .feedback .tip { color:#c2410c; margin-top:6px; }
  .feedback .lead { color:#6b4226; margin-top:8px; font-weight:700; }
  .next-btn { margin-top:16px; width:100%; padding:15px; font-size:18px; font-weight:800; border:none; border-radius:14px; cursor:pointer; color:#fff; background: linear-gradient(90deg,#ff9a3c,#ff6b35); display:none; letter-spacing:2px; }
  .next-btn.show { display:block; }
  @keyframes fade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }

  /* ---- 结算 ---- */
  .result { text-align:center; padding: 14px 10px; }
  .result .big-flower svg { width:120px; height:120px; }
  .result .outcome { font-size:30px; font-weight:900; margin:10px 0 4px; }
  .result .outcome.win { color:#2f9e44; }
  .result .outcome.lose { color:#e8542e; }
  .result .rank { font-size:22px; font-weight:800; color:#e8642e; margin-bottom:8px; }
  .result .score-line { font-size:17px; color:#8a5a36; margin-bottom:5px; }
  .result .score-line b { color:#c2410c; font-size:21px; }
  .result .comment { color:#a9714c; margin:14px auto 22px; max-width:540px; line-height:1.6; }
  .hide { display:none !important; }

  /* ---- 桂花特困难模式 ---- */
  .hard-banner { background: linear-gradient(90deg,#b3261e,#e8542e); color:#fff; font-weight:800;
    text-align:center; padding:10px 14px; border-radius:14px; margin-bottom:14px; font-size:14px;
    box-shadow:0 4px 14px rgba(180,40,30,0.4); animation: hardpulse 1.2s ease-in-out infinite; }
  @keyframes hardpulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.015);} }
  #page-quiz.hard .timer-fill { background: linear-gradient(90deg,#ff5c5c,#ff2d2d); }
  #page-quiz.hard .qcard { border-color:#e8542e; box-shadow:0 0 0 2px rgba(232,84,46,0.25); }
  /* ---- 题型多选面板 ---- */
  .topic-panel { background: rgba(255,255,255,0.55); border:1px solid rgba(255,180,130,0.45);
    border-radius:18px; padding:16px; margin:18px 0; }
  .tp-title { font-weight:800; color:#c2410c; font-size:15px; margin-bottom:12px; }
  .tp-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:680px){ .tp-grid{ grid-template-columns:repeat(2,1fr);} }
  .tp-item { display:flex; align-items:center; gap:8px; background:#fffdf9; border:2px solid #ffe0c4;
    border-radius:12px; padding:10px 12px; cursor:pointer; user-select:none; transition:border-color .15s, background .15s; font-size:14px; color:#6b4226; font-weight:600; }
  .tp-item:hover { border-color:#ff9a3c; }
  .tp-item.on { border-color:#ff7a3c; background:#fff3e8; }
  .tp-box { width:20px; height:20px; border-radius:6px; border:2px solid #e8a06a; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; background:#fff; }
  .tp-item.on .tp-box { background:#ff7a3c; border-color:#ff7a3c; }
  .tp-actions { display:flex; align-items:center; gap:10px; margin-top:14px; justify-content:center; }
  .tp-btn { background: linear-gradient(90deg,#ffb347,#ff8a3c); color:#fff; border:none; border-radius:20px;
    padding:7px 22px; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 3px 8px rgba(230,120,40,0.3); }
  .tp-btn.ghost { background:#fff; color:#c2410c; border:2px solid #ffc28a; box-shadow:none; }
  .tp-count { font-size:13px; color:#a9714c; margin-left:6px; }

  /* 选花页：困难花神角标 */
  .card { position:relative; }
  .card .hard-tag { position:absolute; top:6px; right:6px; background:#e8542e; color:#fff;
    font-size:10px; font-weight:800; padding:2px 6px; border-radius:8px; box-shadow:0 2px 6px rgba(180,40,30,0.4); }
</style>
</head>
<body>
<div class="panel">

  <!-- ===== 选花页 ===== -->
  <section id="page-select">
    <h1>花神语文大对战</h1>
    <div class="subtitle">输入名字 → 选花神对手 → 勾选想练的题型 → 15道题、每题10分（满分150）、限时30秒，比花神分高就获胜！（3～6年级·含进阶拔高题）</div>
    <div class="name-row"><input id="player-name" maxlength="8" placeholder="✍️ 请输入你的名字" autocomplete="off"></div>
    <div class="history-card hide" id="history-card">
      <div class="hc-left">
        <div class="hc-badge" id="hc-badge">🌱</div>
        <div class="hc-rank" id="hc-rank">花间萌新</div>
      </div>
      <div class="hc-mid">
        <div class="hc-line" id="hc-greet">欢迎回来！</div>
        <div class="hc-stats" id="hc-stats">胜 0 · 负 0 · 最高 0 分</div>
        <div class="hc-progress"><div class="hc-progress-fill" id="hc-progress-fill"></div></div>
        <div class="hc-next" id="hc-next"></div>
      </div>
    </div>
    <div class="grid" id="flower-grid"></div>

    <div class="topic-panel">
      <div class="tp-title">📚 选择题型（可多选）</div>
      <div class="tp-grid" id="topic-grid"></div>
      <div class="tp-actions">
        <button class="tp-btn" id="topic-all">全选</button>
        <button class="tp-btn ghost" id="topic-none">清空</button>
        <span class="tp-count" id="topic-count"></span>
      </div>
    </div>

    <button class="start-btn" id="start-btn" disabled>⚔️ 请先输入名字并选择花神</button>
  </section>

  <!-- ===== 对战页 ===== -->
  <section id="page-quiz" class="hide">
    <div class="hard-banner hide" id="hard-banner">🌸 桂花花神是最强对手，相信你！沉住气，一题一题答，你一定可以的！</div>
    <div class="battle-bar">
      <div class="fighter side-me" id="side-me">
        <div class="top"><span class="avatar-emoji">🧒</span>
          <div><div class="fname" id="me-name">我</div><div class="frole">挑战者</div></div></div>
        <div class="bigscore" id="me-score">0</div>
        <div class="scoretip">分</div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter side-foe" id="side-foe">
        <div class="top"><span id="foe-icon"></span>
          <div><div class="fname" id="foe-name">花神</div><div class="frole">花神 · 对手</div></div></div>
        <div class="bigscore foe" id="foe-score">0</div>
        <div class="scoretip">分</div>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>

    <div class="timer-row">
      <span class="timer-label">⏱️ 倒计时</span>
      <div class="timer-wrap"><div class="timer-fill" id="timer-fill"></div></div>
      <span class="timer-num" id="timer-num">30</span>
    </div>

    <div class="qcard">
      <div class="qtag" id="qtag">第 1 题</div>
      <div class="qflower" id="qflower"></div>
      <div class="qtext" id="qtext">题目</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div id="fb-body"></div>
      </div>
      <button class="next-btn" id="next-btn">下一题 →</button>
    </div>
  </section>

  <!-- ===== 结算页 ===== -->
  <section id="page-result" class="hide">
    <div class="result">
      <div class="big-flower" id="result-flower"></div>
      <div class="outcome" id="outcome">胜利！</div>
      <div class="rank" id="rank"></div>
      <div class="score-line">最终得分 <b id="final-score">0</b> 分</div>
      <div class="score-line">答对 <b id="final-correct">0</b> / <span id="final-total">10</span> 题</div>
      <div class="comment" id="comment"></div>
      <div class="rank-panel" id="rank-panel">
        <div class="rp-top"><span class="rp-badge" id="rp-badge">🌱</span>
          <span class="rp-name" id="rp-name">花间萌新</span></div>
        <div class="rp-progress"><div class="rp-progress-fill" id="rp-progress-fill"></div></div>
        <div class="rp-next" id="rp-next"></div>
        <div class="rp-record" id="rp-record"></div>
      </div>
      <button class="start-btn" id="again-btn">🔄 再来一局</button>
    </div>
  </section>

</div>

<script>
/* ---------------- 十二花神 ---------------- */
const FLOWERS = {
  mei:    { name:"梅花花神·林逋",  short:"梅花" },
  xing:   { name:"杏花花神·陆游",  short:"杏花" },
  tao:    { name:"桃花花神·息夫人", short:"桃花" },
  shao:   { name:"芍药花神·杨玉环", short:"芍药" },
  liu:    { name:"石榴花神·张骞",  short:"石榴花" },
  he:     { name:"荷花花神·李白",  short:"荷花" },
  kui:    { name:"蜀葵花神·徐渭",  short:"蜀葵" },
  gui:    { name:"桂花花神·李清照", short:"桂花" },
  ju:     { name:"菊花花神·陶渊明", short:"菊花" },
  furong: { name:"芙蓉花神·王昭君", short:"芙蓉" },
  ch6:    { name:"山茶花神·白居易", short:"山茶" },
  shui:   { name:"水仙花神·洛神",  short:"水仙" },
};
const ORDER = ["mei","xing","tao","shao","liu","he","kui","gui","ju","furong","ch6","shui"];

/* ---------------- SVG 写实花朵 ---------------- */
// 花瓣路径生成器（基于花心 50,50，朝上）
function pRound(h,w){ return `M50 50 C ${50-w} ${50-h*0.35} ${50-w*0.92} ${50-h*0.92} 50 ${50-h} C ${50+w*0.92} ${50-h*0.92} ${50+w} ${50-h*0.35} 50 50 Z`; }
function pPoint(h,w){ return `M50 50 C ${50-w} ${50-h*0.45} ${50-w*0.5} ${50-h*0.9} 50 ${50-h} C ${50+w*0.5} ${50-h*0.9} ${50+w} ${50-h*0.45} 50 50 Z`; }
function pNotch(h,w){ return `M50 50 C ${50-w} ${50-h*0.4} ${50-w*0.95} ${50-h*0.86} ${50-w*0.3} ${50-h*0.97} L50 ${50-h*0.8} L${50+w*0.3} ${50-h*0.97} C ${50+w*0.95} ${50-h*0.86} ${50+w} ${50-h*0.4} 50 50 Z`; }
// 花瓣环
function ring(n, path, fill, stroke, sw, rot0){
  let s=""; for(let i=0;i<n;i++){const a=(360/n)*i+(rot0||0);
    s+=`<path d="${path}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" transform="rotate(${a} 50 50)"/>`;}
  return s;
}
// 花瓣脉络（增加质感）
function veinRing(n,h,w,color,rot0){
  let s=""; for(let i=0;i<n;i++){const a=(360/n)*i+(rot0||0);
    s+=`<g transform="rotate(${a} 50 50)" stroke="${color}" stroke-width="0.5" fill="none" opacity="0.4"><path d="M50 50 L50 ${50-h*0.8}"/><path d="M50 50 Q ${50-w*0.3} ${50-h*0.4} ${50-w*0.16} ${50-h*0.72}"/><path d="M50 50 Q ${50+w*0.3} ${50-h*0.4} ${50+w*0.16} ${50-h*0.72}"/></g>`;}
  return s;
}
// 弯曲花蕊
function stamens(n,len,line,dot,r0){
  let s=""; for(let i=0;i<n;i++){const a=(360/n)*i+(r0||0);
    s+=`<g transform="rotate(${a} 50 50)"><path d="M50 50 Q ${50-1.4} ${50-len*0.6} 50 ${50-len}" stroke="${line}" stroke-width="0.8" fill="none"/><circle cx="50" cy="${50-len}" r="1.4" fill="${dot}"/></g>`;}
  return s;
}

function photoURL(key, w){

// 返回 <img> 真实照片；onerror 时整体替换为 SVG 插画（兜底，永不空白）
function flowerMedia(key, w){

  return '<img class="flower-img" src="'+url+'" alt="'+FLOWERS[key].short+'" loading="lazy" '+
         'onerror="this.outerHTML=window.__fb(\''+key+'\')">';
}

  {type:"多音字", q:'“强迫”的“强”应读？', o:["qiǎng","qiáng","jiàng","qiāng"], a:0, tip:"强迫读 qiǎng；强大读 qiáng；倔强读 jiàng。"},
  {type:"多音字", q:'“处理”的“处”应读？', o:["chǔ","chù","chú","cù"], a:0, tip:"处理读 chǔ（动词）；到处读 chù（名词）。"},
  {type:"字词", q:'下面哪一组词全部没有错别字？', o:["再接再厉、川流不息","再接再励、穿流不息","变本加利、莫明其妙","不径而走、谈笑风声"], a:0, tip:"正确写法：再接再厉、川流不息、变本加厉、莫名其妙。"},
  {type:"字词", q:'“一( )莫展”形容毫无办法，括号里填？', o:["筹","愁","酬","绸"], a:0, tip:"成语是“一筹莫展”，筹＝计策、办法。"},
];

/* ---------------- 段位系统 ---------------- */
// 按“累计胜场”升段，越往后越荣耀；wins=升到该段所需的累计胜场
const RANKS = [
  {wins:0,   badge:"🌱", name:"花间萌新"},
  {wins:2,   badge:"🌿", name:"含苞学徒"},
  {wins:5,   badge:"🌸", name:"初绽花使"},
  {wins:9,   badge:"🌺", name:"花林新秀"},
  {wins:14,  badge:"💮", name:"诗词花匠"},
  {wins:20,  badge:"🏵️", name:"花神门徒"},
  {wins:28,  badge:"🌷", name:"百花才子"},
  {wins:38,  badge:"🌹", name:"花中翘楚"},
  {wins:50,  badge:"👑", name:"花神之王"},
];
function rankByWins(w){ let r=RANKS[0]; for(const t of RANKS){ if(w>=t.wins) r=t; } return r; }
function nextRank(w){ for(const t of RANKS){ if(w<t.wins) return t; } return null; }

/* ---------------- 历史存档（按名字，localStorage）---------------- */
const HKEY="huashen_history_v1";
function loadAll(){ try{ return JSON.parse(localStorage.getItem(HKEY)||"{}"); }catch(e){ return {}; } }
function saveAll(o){ try{ localStorage.setItem(HKEY, JSON.stringify(o)); }catch(e){} }
function getRec(name){
  const all=loadAll();
  return all[name] || {wins:0, losses:0, plays:0, best:0, streak:0, bestStreak:0};
}
function setRec(name, rec){ const all=loadAll(); all[name]=rec; saveAll(all); }

/* ---------------- 状态 ---------------- */
let selected=null, playerName="", quiz=[], idx=0, correctCount=0;
let meScore=0, foeScore=0, foeCorrect=0;
let timer=null, timeLeft=0, answered=false;
let timeLimit=30, hardMode=false; // 本局参数（桂花=特困难：15秒+花神全对）
const ROUND=15, PER=10, FOE_CAP=11; // 15题，每题10分，最高150；普通花神最多答对11题(=110分)
const HARD_KEY="gui", HARD_TIME=15;  // 桂花花神：特困难模式
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 花神AI */
function deityTurn(correct){
  if(hardMode){
    // 桂花特困难：花神每题必对(满分150)，玩家必须15题全对才能打平取胜
    foeCorrect++; foeScore=foeCorrect*PER;
    return;
  }
  if(foeCorrect>=FOE_CAP) return; // 普通模式封顶110
  const gap = correctCount - foeCorrect; // 玩家领先多少题
  let p;
  if(gap>=2) p=0.92;       // 玩家领先 → 奋起直追
  else if(gap===1) p=0.5;  // 紧咬比分
  else p=0.18;             // 玩家未领先 → 偶尔超前，制造紧张
  if(Math.random()<p){ foeCorrect++; foeScore=foeCorrect*PER; }
}

/* ---------- 倒计时 ---------- */
function startTimer(){
  stopTimer();
  timeLeft=timeLimit;
  paintTimer();
  timer=setInterval(()=>{
    timeLeft--;
    paintTimer();
    if(timeLeft<=0){ stopTimer(); timeUp(); }
  },1000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function paintTimer(){
  const pct=Math.max(0,timeLeft/timeLimit*100);
  const fill=$("timer-fill"), num=$("timer-num");
  fill.style.width=pct+"%";
  num.textContent=timeLeft;
  // 困难模式时间短，按比例变色
  const warnAt=hardMode?8:10, dangerAt=hardMode?4:5;
  fill.className="timer-fill"+(timeLeft<=dangerAt?" danger":(timeLeft<=warnAt?" warn":""));
  num.className="timer-num"+(timeLeft<=dangerAt?" danger":"");
}

/* ---------- 选花页 ---------- */
function buildSelect(){
  const grid=$("flower-grid"); grid.innerHTML="";
  ORDER.forEach(key=>{
    const f=FLOWERS[key];
    const div=document.createElement("div");
    div.className="card";
    const hardTag = (key===HARD_KEY) ? '<div class="hard-tag">👹特困难</div>' : '';
    div.innerHTML=hardTag+flowerMedia(key,320)+`<div class="name">${f.short}</div><div class="lvl">${f.name.split('·')[1]||''}</div>`;
    div.onclick=()=>{document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));div.classList.add("selected");selected=key;updateStart();};
    grid.appendChild(div);
  });
}

/* ---------- 题型多选面板 ---------- */
let allTypes=[], chosenTypes=new Set();
function buildTopics(){
  // 题库里出现的全部题型，按固定顺序排列
  const order=["古诗","作者","课文常识","文言文","成语","好词好句","近义词","反义词","关联词","病句","标点","多音字","字词","修辞"];
  const present=new Set(BANK.map(q=>q.type));
  allTypes=order.filter(t=>present.has(t)).concat([...present].filter(t=>!order.includes(t)));
  chosenTypes=new Set(allTypes); // 默认全选
  const grid=$("topic-grid"); grid.innerHTML="";
  allTypes.forEach(t=>{
    const cnt=BANK.filter(q=>q.type===t).length;
    const el=document.createElement("div");
    el.className="tp-item on";
    el.innerHTML=`<span class="tp-box">✓</span><span>${t}</span>`;
    el.onclick=()=>{
      if(chosenTypes.has(t)) chosenTypes.delete(t); else chosenTypes.add(t);
      el.classList.toggle("on", chosenTypes.has(t));
      el.querySelector(".tp-box").textContent = chosenTypes.has(t)?"✓":"";
      updateTopicCount(); updateStart();
    };
    grid.appendChild(el);
  });
  updateTopicCount();
}
function updateTopicCount(){
  const avail=BANK.filter(q=>chosenTypes.has(q.type)).length;
  $("topic-count").textContent="已选 "+chosenTypes.size+" 类 · 共 "+avail+" 题";
}
$("topic-all").onclick=()=>{ chosenTypes=new Set(allTypes);
  document.querySelectorAll(".tp-item").forEach(el=>{el.classList.add("on");el.querySelector(".tp-box").textContent="✓";});
  updateTopicCount(); updateStart(); };
$("topic-none").onclick=()=>{ chosenTypes.clear();
  document.querySelectorAll(".tp-item").forEach(el=>{el.classList.remove("on");el.querySelector(".tp-box").textContent="";});
  updateTopicCount(); updateStart(); };

function updateStart(){
  const nm=$("player-name").value.trim();
  const btn=$("start-btn");
  const avail=BANK.filter(q=>chosenTypes.has(q.type)).length;
  if(nm && selected && chosenTypes.size>0 && avail>=ROUND){
    btn.disabled=false;
    btn.textContent = (selected===HARD_KEY)
      ? "🌸 挑战最强「桂花花神」，全力以赴！"
      : "⚔️ 挑战「"+FLOWERS[selected].short+"花神」！";
  }
  else {
    btn.disabled=true;
    btn.textContent = !nm ? "⚔️ 请先输入你的名字"
      : !selected ? "⚔️ 请选择一位花神"
      : chosenTypes.size===0 ? "⚔️ 请至少选择一种题型"
      : "⚔️ 所选题型不足"+ROUND+"题，请多选几种";
  }
  renderHistoryCard(nm);
}
function renderHistoryCard(nm){
  const card=$("history-card");
  if(!nm){ card.classList.add("hide"); return; }
  const rec=getRec(nm);
  const cur=rankByWins(rec.wins), nxt=nextRank(rec.wins);
  $("hc-badge").textContent=cur.badge;
  $("hc-rank").textContent=cur.name;
  if(rec.plays===0){
    $("hc-greet").textContent="👋 "+nm+"，第一次来！打败花神就能升段位～";
  }else{
    $("hc-greet").textContent="👋 欢迎回来，"+nm+"！" + (rec.streak>=2 ? "（已连胜 "+rec.streak+" 场🔥）" : "");
  }
  $("hc-stats").textContent="胜 "+rec.wins+" · 负 "+rec.losses+" · 最高 "+rec.best+" 分";
  if(nxt){
    const span=nxt.wins-cur.wins, done=rec.wins-cur.wins;
    $("hc-progress-fill").style.width=Math.min(100, done/span*100)+"%";
    $("hc-next").textContent="再赢 "+(nxt.wins-rec.wins)+" 场，升到「"+nxt.badge+" "+nxt.name+"」";
  }else{
    $("hc-progress-fill").style.width="100%";
    $("hc-next").textContent="🎉 已达最高段位「"+cur.badge+" "+cur.name+"」，继续卫冕吧！";
  }
  card.classList.remove("hide");
}
$("player-name").addEventListener("input", ()=>updateStart());

/* ---------- 开始对战 ---------- */
function startGame(){
  playerName=$("player-name").value.trim()||"小勇士";
  // 桂花花神 = 特困难模式：15秒限时 + 花神题题全对
  hardMode = (selected===HARD_KEY);
  timeLimit = hardMode ? HARD_TIME : 30;
  // 每次随机抽题，且尽量类型多样（15题）
  quiz=pickVaried(ROUND);
  idx=0; correctCount=0; meScore=0; foeScore=0; foeCorrect=0;
  $("me-name").textContent=playerName;
  $("foe-name").textContent=FLOWERS[selected].short+"花神"+(hardMode?" 👹":"");
  $("foe-icon").innerHTML=flowerMedia(selected,120);
  $("page-quiz").classList.toggle("hard", hardMode);
  $("hard-banner").classList.toggle("hide", !hardMode);
  updateScore();
  show("page-quiz"); renderQ();
}
/* 抽题：只从勾选的题型里抽，按类型轮流取，保证一局题型丰富且随机 */
function pickVaried(n){
  const pool = BANK.filter(q=>chosenTypes.size===0 || chosenTypes.has(q.type));
  const byType={};
  pool.forEach(q=>{(byType[q.type]=byType[q.type]||[]).push(q);});
  const types=shuffle(Object.keys(byType));
  const pools={}; types.forEach(t=>pools[t]=shuffle(byType[t]));
  const out=[]; let ti=0, guard=0;
  while(out.length<n && guard<500){
    const t=types[ti%types.length];
    if(pools[t].length){ out.push(pools[t].pop()); }
    ti++; guard++;
  }
  return shuffle(out).slice(0,n);
}

function renderQ(){
  const item=quiz[idx];
  $("progress").style.width=((idx)/quiz.length*100)+"%";
  $("qtag").textContent="第 "+(idx+1)+" / "+quiz.length+" 题 · "+item.type;
  // 古诗题配上当前花神的花朵图，其它题不配图，保持简洁
  $("qflower").innerHTML = (item.type==="古诗") ? flowerMedia(selected,200) : "";
  $("qtext").textContent=item.q;
  const opts=item.o.map((t,i)=>({t,ok:i===item.a}));
  const sh=shuffle(opts);
  window.__sh=sh;
  const box=$("options"); box.innerHTML="";
  sh.forEach(o=>{
    const b=document.createElement("div");
    b.className="opt"; b.textContent=o.t;
    b.onclick=()=>choose(b,o.ok,item,sh);
    box.appendChild(b);
  });
  $("feedback").className="feedback"; $("next-btn").className="next-btn";
  answered=false;
  startTimer();
}

function revealAnswer(item,sh){
  document.querySelectorAll(".opt").forEach(o=>{const m=sh.find(s=>s.t===o.textContent);if(m&&m.ok)o.classList.add("correct");});
}

function timeUp(){
  if(answered) return;
  answered=true;
  const item=quiz[idx], sh=window.__sh;
  document.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  deityTurn();
  if(sh) revealAnswer(item,sh);
  const fb=$("feedback"); fb.className="feedback show no";
  $("fb-title").textContent="⏰ 时间到！这一题没拿到分~";
  finishTurn(item);
}

function choose(btn,ok,item,sh){
  if(answered) return;
  answered=true; stopTimer();
  window.__sh=sh;
  document.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  const fb=$("feedback");
  if(ok){
    btn.classList.add("correct"); correctCount++; meScore=correctCount*PER;
    fb.className="feedback show ok";
    $("fb-title").textContent="✓ 答对啦！+10 分，得分追上花神！";
  }else{
    btn.classList.add("wrong");
    revealAnswer(item,sh);
    fb.className="feedback show no";
    $("fb-title").textContent="✗ 答错了，这一题没拿到分~";
  }
  deityTurn(); // 花神也答这一题
  finishTurn(item);
}

function finishTurn(item){
  updateScore();
  let lead;
  if(hardMode){
    const perfect = (correctCount===idx+1); // 到目前为止全对
    lead = perfect ? "🔥 太棒了，一路全对！稳住节奏，继续加油！"
                   : "💪 没关系，调整好心情，把接下来的每题都答好！";
  }else{
    lead = meScore>foeScore ? "🔥 你暂时领先，加油保持！"
         : meScore===foeScore ? "⚖️ 比分咬得很紧，下一题决胜负！"
         : "💪 花神暂时领先，答对就能反超，别放弃！";
  }
  $("fb-body").innerHTML='<div class="tip">📖 '+item.tip+'</div><div class="lead">'+lead+'</div>';
  const nb=$("next-btn"); nb.className="next-btn show";
  const last=(idx>=quiz.length-1);
  nb.textContent=last?"查看战果 🏆":"下一题 →";
}
function updateScore(){
  $("me-score").textContent=meScore;
  $("foe-score").textContent=foeScore;
  $("side-me").classList.toggle("leading", meScore>=foeScore);
  $("side-foe").classList.toggle("leading", foeScore>meScore);
}
$("next-btn").onclick=()=>{
  if(idx>=quiz.length-1){finish();}
  else{idx++;renderQ();}
};

function finish(){
  stopTimer();
  $("progress").style.width="100%";
  $("result-flower").innerHTML=flowerMedia(selected,260);
  $("final-score").textContent=meScore;
  $("final-correct").textContent=correctCount;
  $("final-total").textContent=quiz.length;
  const win = meScore>=foeScore; // 平局也算玩家赢，鼓励为主
  const foeName=FLOWERS[selected].short+"花神";
  const oc=$("outcome");
  if(win){
    oc.textContent="🎉 "+playerName+" 胜利！"; oc.className="outcome win";
  }else{
    oc.textContent="💪 "+playerName+" 惜败！"; oc.className="outcome lose";
  }
  let rank,comment;
  const r=correctCount/quiz.length;
  if(hardMode){
    // 桂花特困难：只有15题全对(150分)才算胜
    if(win){
      rank="👑 称号：桂花花神·克星";
      comment="🌟 难以置信！你在 15 秒/题 的极限下 15 题全对，击败了最强的桂花花神！自是花中第一流，非你莫属！";
    }else{
      rank="🔥 称号：无畏挑战者";
      comment="你答对了 "+correctCount+" / 15 题（"+meScore+" 分），桂花花神满分 150 太强了！但敢挑战特困难就已经很了不起，再来一次冲击全对吧！";
    }
  }else if(win){
    if(r===1){rank="🏆 称号：花神之王";comment="满分通关！你以 "+meScore+" 分完胜 "+foeName+"，古诗好词样样精通，太厉害啦！";}
    else if(r>=0.8){rank="🌟 称号：语文高手";comment="你以 "+meScore+" : "+foeScore+" 打败了 "+foeName+"！再多记几句就能拿满分，继续挑战吧！";}
    else {rank="🌸 称号：诗词小达人";comment="恭喜！你以 "+meScore+" : "+foeScore+" 赢了 "+foeName+"！把答错的题再读一遍，下次赢得更漂亮！";}
  }else{
    rank="🌱 称号：勇敢挑战者";
    comment=foeName+" 这次以 "+foeScore+" : "+meScore+" 略胜一筹，但你已经很棒啦！再来一局，相信你一定能反超！";
  }
  $("rank").textContent=rank; $("comment").textContent=comment;

  // ---- 记录历史 + 段位 ----
  const rec=getRec(playerName);
  const beforeRank=rankByWins(rec.wins);
  rec.plays++;
  if(win){ rec.wins++; rec.streak=(rec.streak||0)+1; }
  else { rec.losses++; rec.streak=0; }
  rec.bestStreak=Math.max(rec.bestStreak||0, rec.streak);
  rec.best=Math.max(rec.best||0, meScore);
  setRec(playerName, rec);
  renderRankPanel(rec, beforeRank, win);

  show("page-result");
}

function renderRankPanel(rec, beforeRank, win){
  const cur=rankByWins(rec.wins), nxt=nextRank(rec.wins);
  $("rp-badge").textContent=cur.badge;
  $("rp-name").textContent=cur.name;
  let nextTxt="";
  if(cur.name!==beforeRank.name){
    nextTxt='<span class="rp-up">🎊 段位提升！晋级为「'+cur.badge+' '+cur.name+'」！</span><br>';
  }
  if(nxt){
    const span=nxt.wins-cur.wins, done=rec.wins-cur.wins;
    $("rp-progress-fill").style.width=Math.min(100, done/span*100)+"%";
    nextTxt+="再赢 "+(nxt.wins-rec.wins)+" 场，就能升到「"+nxt.badge+" "+nxt.name+"」，加油！";
  }else{
    $("rp-progress-fill").style.width="100%";
    nextTxt+="🏆 你已登顶最高段位「"+cur.badge+" "+cur.name+"」，了不起！";
  }
  $("rp-next").innerHTML=nextTxt;
  let rLine="累计：胜 "+rec.wins+" · 负 "+rec.losses+" · 最高 "+rec.best+" 分";
  if(rec.streak>=2) rLine+="　🔥 当前连胜 "+rec.streak+" 场";
  $("rp-record").textContent=rLine;
}

function show(id){["page-select","page-quiz","page-result"].forEach(p=>$(p).classList.add("hide"));$(id).classList.remove("hide");}

$("start-btn").onclick=()=>{ if(selected && $("player-name").value.trim()) startGame(); };
$("again-btn").onclick=()=>{
  selected=null;
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
  updateStart();
  show("page-select");
};

buildSelect(); buildTopics(); updateStart();
</script>
